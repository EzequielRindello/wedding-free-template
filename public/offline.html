<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexion | Invitacion</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(180deg, #e7ecef 0%, #d5e2ed 100%);
        color: #264766;
      }

      main {
        width: min(520px, 100%);
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        padding: 24px;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.5rem, 4vw, 2rem);
      }

      p {
        margin: 8px 0;
        line-height: 1.6;
      }

      button {
        margin-top: 16px;
        background: #274c77;
        color: #fff;
        border: none;
        border-radius: 999px;
        padding: 12px 18px;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No hay conexion a internet</h1>
      <p>La invitacion sigue disponible cuando recuperes internet.</p>
      <p>Podes reintentar ahora o esperar a que vuelva la conexion.</p>
      <button type="button" id="reload-button">Reintentar</button>
    </main>

    <script>
      document.getElementById('reload-button').addEventListener('click', () => {
        window.location.reload();
      });

      window.addEventListener('online', () => {
        window.location.reload();
      });
    </script>
  </body>
</html>
